[package]
name = "kanerva"
version = "0.1.0"
edition = "2024"
# the oldest Rust that builds every target (checked with `cargo +1.87 build --all-targets`, 2026-10-05)
rust-version = "1.87"
description = "KANERVA: a toolbox for Kanerva's sparse distributed memory (hard-locations, reads, soft cut-off, keys, capacity theory, refusal, content-read predictors). Zero dependencies."
readme = "README.md"
repository = "https://github.com/TripleSparkleAI/KANERVA"
keywords = ["sparse-distributed-memory", "kanerva", "associative-memory", "hyperdimensional"]
categories = ["algorithms", "science"]
# MIT (the navigator, 2026-10-09); the text is LICENSE
license = "MIT"
# not on crates.io: the owner decides (RELEASE_CHECKLIST.md)
publish = false

[lib]
name = "kanerva"
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3

# `cargo test` without --release still runs optimised: the measured examples run seconds optimised and minutes
# unoptimised (measured 2026-10-06: the example tests took 339 s at opt-level 0). Overflow checks stay on.
[profile.test]
opt-level = 3
